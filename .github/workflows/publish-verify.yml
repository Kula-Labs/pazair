# Publishes pazair-verify to npm when a tag like verify-v1.1.0 is pushed.
# Needs the repository secret NPM_TOKEN (an npm automation token of the Kula Labs npm account).
name: publish pazair-verify
on:
  push:
    tags: ['verify-v*']
permissions:
  contents: read
  id-token: write # npm provenance: anyone can see this package was built from this repository
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: verify } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - run: npm test
      - run: test "verify-v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
