# Publishes when a tag is pushed:
#   verify-v1.6.1 -> npm pazair-verify    issuer-v1.1.0 -> npm word-pass-issuer    python-v1.6.1 -> PyPI pazair-verify
# npm: trusted publishing (OIDC) once configured on npmjs.com; until then the repository secret NPM_TOKEN.
# PyPI: trusted publishing only (no token). Release steps: RELEASING.md.
name: publish
on:
  push:
    tags: ['verify-v*', 'issuer-v*', 'python-v*']
permissions:
  contents: read
jobs:
  npm:
    if: ${{ !startsWith(github.ref_name, 'python-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance: anyone can see the package was built from this repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@11 # trusted publishing needs npm 11.5 or later
      - name: package from the tag
        run: echo "DIR=${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_ENV"
      - run: npm test
        working-directory: ${{ env.DIR }}
      - run: test "${DIR}-v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
        working-directory: ${{ env.DIR }}
      - run: npm publish --provenance --access public
        working-directory: ${{ env.DIR }}
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' } # empty once trusted publishing is set up: OIDC is used
  pypi:
    if: ${{ startsWith(github.ref_name, 'python-v') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: pip install cryptography build
      - run: python -m unittest discover -s tests
      - run: test "python-v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with: { packages-dir: python/dist }
