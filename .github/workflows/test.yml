name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy: { matrix: { node: [20, 22, 24] } }
    defaults: { run: { working-directory: verify } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci   # dev only: @noble/post-quantum, so the ML-DSA-65 path is tested; the published package has no dependencies
      - run: npm test
      - run: rm -rf node_modules && npm test   # and without it: ML-DSA-65 reports "not checked", never "valid"
  issuer:
    runs-on: ubuntu-latest
    strategy: { matrix: { node: [20, 22, 24] } }
    defaults: { run: { working-directory: issuer } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ matrix.node }}' }
      - run: npm install   # dev only: @noble/post-quantum, so the second signature (section 16) is tested; the published package has no dependencies
      - run: npm test
      - run: rm -rf node_modules && npm test   # and without it: the twice-signing test is skipped, everything else holds
  a2a:
    runs-on: ubuntu-latest
    strategy: { matrix: { node: [20, 22, 24] } }
    defaults: { run: { working-directory: a2a } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ matrix.node }}' }
      - run: npm test   # no dependencies; the gate, the evidence object and the vector of SPEC 17
      - run: node scripts/build-reasons.mjs && node scripts/make-vector.mjs && git diff --exit-code ../vectors/a2a-transfer-1.json src/reasons.js   # vector and generated reasons reproduce byte for byte
      - run: node ../examples/gate.mjs
  python:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ['3.9', '3.13'] } }
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '${{ matrix.python }}' }
      - run: pip install cryptography
      - run: python -m unittest discover -s tests
  standard:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: standard } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci   # playwright-core only
      - run: npx playwright-core install --with-deps chromium   # the Chromium this playwright-core was built for, so the result never depends on the runner's Chrome
      - run: node check.mjs   # MASSSTAB.md: contrast, text size, 44 px targets, nothing cut off, structure, no third parties; any finding fails
