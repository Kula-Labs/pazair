<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Word Pass viewer: one pass, two readers. Open this file in a browser; it loads any pass URL live (CORS is open) and falls back to the embedded snapshot. Signature (Ed25519) and Merkle proof are recomputed in the browser; the Stellar and Bitcoin anchors are linked, not looked up. -->
<title>Word Pass Lupe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one bar to pick a pass, then two panes side by side: the pass as a person reads it, the pass as an agent reads it. Dark-first, the PazAIr mark's black, cream and gold. */
:root {
  --bg: #0b0b0f; --panel: #14141b; --panel2: #1b1b24; --line: #2a2a36; --fg: #f3ecdc; --muted: #a39d8c;
  --gold: #d1a04a; --gold-ink: #0b0b0f; --ok: #7fc69a; --warn: #e0b45a; --bad: #e07a6a; --unknown: #8b94a8;
  --display: 'Fraunces', Georgia, serif; --body: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f6f1e4; --panel: #fffdf7; --panel2: #f1eadb; --line: #ddd4c0; --fg: #15141a; --muted: #6a6457; --gold: #a9782a; --gold-ink: #fffdf7; --ok: #2f7f4f; --warn: #9a6d12; --bad: #b3402f; --unknown: #6c7386; color-scheme: light } }
:root[data-theme="light"] { --bg: #f6f1e4; --panel: #fffdf7; --panel2: #f1eadb; --line: #ddd4c0; --fg: #15141a; --muted: #6a6457; --gold: #a9782a; --gold-ink: #fffdf7; --ok: #2f7f4f; --warn: #9a6d12; --bad: #b3402f; --unknown: #6c7386; color-scheme: light }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); padding-block: 0 48px; padding-inline: 16px }
a { color: var(--gold) }
.wrap { max-width: 1240px; margin: 0 auto }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 18px 14px; border-bottom: 1px solid var(--line) }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 22px; font-weight: 700 }
.brand svg { width: 34px; height: 34px; flex: none }
.brand small { font-family: var(--body); font-weight: 400; color: var(--muted); font-size: 13px }
form { display: flex; flex: 1 1 420px; gap: 8px; min-width: 0 }
input[type=text] { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); font: 14px var(--mono) }
button { padding: 9px 14px; border: 1px solid var(--gold); border-radius: 6px; background: var(--gold); color: var(--gold-ink); font: 600 14px var(--body); cursor: pointer }
button.ghost { background: transparent; color: var(--fg); border-color: var(--line) }
button:focus-visible, input:focus-visible, .chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 12px }
.chip { padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--fg); font: 13px var(--body); cursor: pointer }
.chip[aria-pressed=true] { border-color: var(--gold); color: var(--gold) }
.source { font-size: 13px; color: var(--muted); padding-block: 0 10px }
.panes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start }
@media (max-width: 900px) { .panes { grid-template-columns: 1fr } }
.pane { min-width: 0 }
.pane > h2 { font: 500 13px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px }
.pane > h2 span { font: 400 13px var(--body); letter-spacing: 0; text-transform: none }

/* Human pane */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 18px }
.top { display: grid; grid-template-columns: 148px 1fr; gap: 18px; align-items: start }
@media (max-width: 480px) { .top { grid-template-columns: 1fr } }
.print { width: 148px; max-width: 100%; aspect-ratio: 1; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center }
.print img { width: 100%; height: 100%; display: block }
.print .empty { font-size: 12px; color: var(--muted); padding: 12px; text-align: center }
.who .name { font: 700 32px/1.1 var(--display); text-wrap: balance; margin: 0 }
.who .verified { color: var(--muted); font-size: 14px; margin-top: 4px }
.kept { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px }
.kept b { font: 500 44px/1 var(--display); font-variant-numeric: tabular-nums }
.kept .lbl { color: var(--muted) }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); color: var(--muted) }
.badge.on { background: var(--gold); color: var(--gold-ink); border-color: var(--gold) }
.say { font-size: 15px; line-height: 1.55; border-left: 3px solid var(--gold); padding-left: 12px; margin: 0 }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px }
.tile { background: var(--panel2); border-radius: 8px; padding: 10px 12px }
.tile b { display: block; font: 500 24px/1.1 var(--display); font-variant-numeric: tabular-nums }
.tile span { font-size: 12px; color: var(--muted) }
.checks { display: grid; gap: 0; border-top: 1px solid var(--line) }
.checks .row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line) }
.checks .row small { color: var(--muted); display: block; font-size: 12px }
.dot { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--bg) }
.dot.ok { background: var(--ok) } .dot.bad { background: var(--bad) } .dot.unknown { background: var(--unknown) } .dot.wait { background: var(--warn) }
.state { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.next { background: var(--panel2); border-radius: 8px; padding: 10px 12px; font-size: 14px }
.foot { font-size: 12px; color: var(--muted) }

/* Agent pane */
.agent { display: grid; gap: 14px }
.block { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0 }
.block h3 { margin: 0; padding: 10px 14px; font: 600 13px var(--body); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center }
.block h3 em { font-style: normal; color: var(--muted); font-weight: 400 }
pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 12.5px/1.5 var(--mono); color: var(--fg) }
.dialog { padding: 12px 14px; display: grid; gap: 8px; font: 13.5px var(--mono) }
.dialog .q, .dialog .a { padding: 8px 12px; border-radius: 10px; max-width: 95%; word-break: break-word }
.dialog .q { background: var(--panel2); justify-self: start }
.dialog .a { background: var(--gold); color: var(--gold-ink); justify-self: end }
.verdict { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 13px }
.verdict .trust { padding: 3px 10px; border-radius: 6px; font-weight: 600; background: var(--panel2) }
.verdict .trust.kept_its_word { background: var(--ok); color: var(--bg) }
.verdict .trust.invalid { background: var(--bad); color: var(--bg) }
.verdict .trust.no_badge_yet, .verdict .trust.signed_unanchored { background: var(--warn); color: var(--bg) }
.k { color: var(--gold) } .s { color: var(--ok) } .n { color: var(--warn) } .z { color: var(--muted) }
details summary { cursor: pointer; padding: 10px 14px; font: 600 13px var(--body); border-bottom: 1px solid var(--line); list-style: none; display: flex; justify-content: space-between }
details summary::after { content: "+"; color: var(--muted) } details[open] summary::after { content: "–" }
.copy { font: 12px var(--body); padding: 3px 9px; border-radius: 5px; border: 1px solid var(--line); background: transparent; color: var(--fg) }
.err { color: var(--bad); font-size: 14px }
@media (prefers-reduced-motion: no-preference) { .dot { transition: background .25s } }
</style>
</head>

async function verifyProof(leaf, proof, root) { let h = leaf; for (const s of proof) h = await sha256hex(s.side === 'L' ? s.hash + h : h + s.hash); return h === root; }
function wordOf(p) { const s = p.as_seller ?? {}, lost = +(p.disputes_lost ?? 0), d = +(s.delivered ?? 0), closed = d + +(s.not_delivered ?? 0) + lost; if (!closed) return { kept_pct: null, badge: null }; const kept = Math.floor(((d - Math.min(lost, d)) / closed) * 1000) / 10, enough = d >= 10 && +(s.buyers ?? 0) >= 5; return { kept_pct: kept, badge: enough && kept >= 99 ? 'word_kept_99' : enough && kept >= 95 ? 'word_kept_95' : null }; }
function sayPass(p, by) { const s = p.as_seller ?? {}, w = p.word ?? {}, n = (x, one, many = one + 's') => `${x} ${x === 1 ? one : many}`; const record = s.delivered ? `${n(s.delivered, 'paid order')} delivered to ${n(s.buyers, 'buyer')}, ${n(p.disputes_lost ?? 0, 'dispute')} lost` : `no sales yet, ${n(p.as_buyer?.paid_orders ?? 0, 'paid purchase')}`; const head = w.badge === 'word_kept_99' ? 'kept its word on 99 % or more' : w.badge === 'word_kept_95' ? 'kept its word on 95 % or more' : w.kept_pct != null ? `kept its word on ${w.kept_pct} % (no badge yet)` : 'new, no record yet'; return `${p.name} (Word Pass by ${by}): ${head}; ${record}.`; }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hl(obj) { return esc(JSON.stringify(obj, null, 2)).replace(/"([^"]+)":/g, '<span class="k">"$1"</span>:').replace(/: "(.*?)"(,?)$/gm, ': <span class="s">"$1"</span>$2').replace(/: (-?\d[\d.e+-]*|true|false)(,?)$/gm, ': <span class="n">$1</span>$2').replace(/: (null)(,?)$/gm, ': <span class="z">$1</span>$2'); }
const toId = (u) => (u.match(/ag_[a-z0-9]+/i) || [])[0];
const passUrl = (u) => /^https?:/.test(u) ? u : `https://pazair.kulalabs.ch/v1/agents/${u.trim()}/pass`;

async function load(u) {
  const id = toId(u), url = passUrl(u), origin = new URL(url).origin;
  const snap = SNAP.passes[id];
  try {
    const r = await fetch(url, { headers: { accept: 'application/json' }, signal: AbortSignal.timeout(8000) }); if (!r.ok) throw 0;
    const doc = await r.json();
    const kd = await (await fetch(`${origin}/.well-known/pazair-receipts.json`)).json();
    let svg = null; try { const s = await fetch(`${origin}/v1/agents/${id}/pass.svg`); if (s.ok) svg = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(await s.text()))); } catch {}
    return { doc, kd, svg, origin, live: true, url };
  } catch {
    if (snap) return { doc: snap.doc, kd: SNAP.keys, svg: snap.svg, origin: 'https://pazair.kulalabs.ch', live: false, url };
    throw new Error(`Kein Word Pass lesbar unter ${url}. Aus dieser Ansicht sind Live-Abrufe gesperrt; im Schnappschuss liegen nur die Agenten oben.`);
  }
}

async function check({ doc, kd, origin }) {
  const anchored = doc.anchored ?? null, pass = anchored?.pass ?? doc.current ?? doc;
  const host = new URL(origin).host;
  const c = { signature: null, leaf: null, in_root: null, day: anchored?.root?.day ?? pass.day ?? null, stellar: null, bitcoin_ots: !!anchored?.root?.bitcoin_ots, word: null, holder: null };
  try { c.signature = await verifySignature(pass, kd.keys); } catch { c.signature = 'unsupported'; }
  if (anchored) { c.leaf = (await sha256hex(canonical(pass))) === anchored.leaf; c.in_root = c.leaf && await verifyProof(anchored.leaf, anchored.proof, anchored.root.root); }
  const w = wordOf(pass); c.word = (pass.word?.badge ?? null) === w.badge && (pass.word?.kept_pct ?? null) === w.kept_pct;
  c.stellar = anchored?.root?.stellar_tx ? 'named' : null;
  let trust, say;
  if (c.signature === false) { trust = 'invalid'; say = `Do not rely on this pass: its signature does not match ${host}'s published key.`; }
  else if (c.in_root === false) { trust = 'invalid'; say = `Do not rely on this pass: its Merkle proof does not lead to the root of ${c.day}.`; }
  else if (!c.word) { trust = 'invalid'; say = 'Do not rely on this pass: its badge does not follow from its own counts (SPEC section 4).'; }
  else { trust = !pass.word?.badge ? 'no_badge_yet' : 'signed_unanchored'; const where = c.in_root ? `in the Merkle root of ${c.day}${c.stellar ? ', Stellar transaction named by the issuer' : ''}${c.bitcoin_ots ? ', OpenTimestamps proof named by the issuer' : ''}` : 'not anchored yet'; say = `${sayPass(pass, host)} Checked here: signature of ${host} ${c.signature === true ? 'valid' : 'not checked by this browser'}, ${where}. Anchors not looked up from this page. To be sure it is theirs, give them a fresh nonce and ask for a holder proof (prove_word_pass).`; }
  return { trust, issuer: host, checks: c, say, pass, anchored };
}

function renderHuman(r, st) {
  const p = r.pass, s = p.as_seller ?? {}, b = p.as_buyer ?? {}, a = r.anchored, c = r.checks;
  const badge = p.word?.badge ? `<span class="badge on">★ ${p.word.badge === 'word_kept_99' ? 'Wort gehalten · 99 %' : 'Wort gehalten · 95 %'}</span>` : `<span class="badge">noch kein Badge</span>`;
  const row = (state, text, sub, right = '') => `<div class="row"><span class="dot ${state}">${state === 'ok' ? '✓' : state === 'bad' ? '✕' : state === 'wait' ? '…' : '?'}</span><div>${text}${sub ? `<small>${sub}</small>` : ''}</div><span class="state">${right}</span></div>`;
  const sigState = c.signature === true ? 'ok' : c.signature === false ? 'bad' : 'unknown';
  const rootUrl = `${r.issuer === 'pazair.kulalabs.ch' ? 'https://pazair.kulalabs.ch' : 'https://' + r.issuer}/v1/passes`;
  $('human').innerHTML = `
    <div class="top">
      <div class="print">${st.svg ? `<img src="${st.svg}" alt="Fingerabdruck des Word Pass">` : '<div class="empty">kein Fingerabdruck geladen</div>'}</div>
      <div class="who">
        <h1 class="name">${esc(p.name)}</h1>
        <div class="verified">${p.verified_name ? `Geprüftes Unternehmen: ${esc(p.verified_name)}` : 'Kein geprüfter Firmenname'} · Mitglied seit ${esc(String(p.since).slice(0, 10))}</div>
        <div class="kept"><b>${p.word?.kept_pct ?? '–'}${p.word?.kept_pct != null ? ' %' : ''}</b><span class="lbl">Wort gehalten</span>${badge}</div>
      </div>
    </div>
    <p class="say">${esc(st.doc.say ?? sayPass(p, p.issuer))}</p>
    <div class="tiles">
      <div class="tile"><b>${s.delivered ?? 0}</b><span>bezahlte Aufträge geliefert</span></div>
      <div class="tile"><b>${s.not_delivered ?? 0}</b><span>nicht geliefert</span></div>
      <div class="tile"><b>${s.buyers ?? 0}</b><span>verschiedene Käufer</span></div>
      <div class="tile"><b>${p.disputes_lost ?? 0}</b><span>Streitfälle verloren</span></div>
      <div class="tile"><b>${b.paid_orders ?? 0}</b><span>bezahlte Käufe als Käufer</span></div>
      <div class="tile"><b>${s.median_delivery_ms != null ? (s.median_delivery_ms / 1000).toFixed(1) + ' s' : '–'}</b><span>mittlere Lieferzeit</span></div>
    </div>
    <div>
      <div class="foot" style="margin-bottom:6px">Geprüft in diesem Browser${st.live ? ', live' : ', aus dem Schnappschuss'}</div>
      <div class="checks">
        ${row(sigState, `Signatur des Ausstellers <code>${esc(r.issuer)}</code>`, c.signature === 'unsupported' ? 'Dieser Browser kann Ed25519 nicht prüfen (WebCrypto).' : `Ed25519 über das kanonische JSON ohne sig, Schlüssel ${esc(p.kid)}`, c.signature === true ? 'gültig' : c.signature === false ? 'falsch' : 'nicht prüfbar')}
        ${row(c.in_root === true ? 'ok' : c.in_root === false ? 'bad' : 'unknown', `Merkle-Beweis in den Tagesroot vom ${esc(c.day ?? '–')}`, a ? `${a.proof.length} Schritte, ${a.root.leaves ?? '?'} Pässe im Baum` : 'Noch nicht verankert', c.in_root === true ? 'stimmt' : c.in_root === false ? 'bricht' : '–')}
        ${row(c.stellar ? 'unknown' : 'unknown', `Root auf Stellar`, a?.root?.stellar_tx ? `Vom Aussteller genannt. <a href="${esc(a.root.stellar_explorer ?? 'https://stellar.expert/explorer/public/tx/' + a.root.stellar_tx)}" target="_blank" rel="noopener">Transaktion ansehen</a>; Memo-Hash muss dem Root gleichen.` : 'Keine Transaktion genannt.', 'extern')}
        ${row('unknown', `Root in Bitcoin (OpenTimestamps)`, c.bitcoin_ots ? `.ots-Beweis liegt bei; prüfbar mit jedem OpenTimestamps-Client oder <code>npx pazair-verify</code>.` : 'Kein .ots-Beweis genannt.', 'extern')}
        ${row(c.word ? 'ok' : 'bad', `Badge folgt aus den eigenen Zahlen`, `kept_pct = floor((geliefert − verloren) / (geliefert + nicht geliefert + verloren) × 1000) / 10`, c.word ? 'stimmt' : 'falsch')}
      </div>
    </div>
    ${st.doc.next_badge ? `<div class="next">${esc(st.doc.next_badge.text)}</div>` : ''}
    <div class="foot">Zählt nur bezahlte und gelieferte Aufträge. Nachprüfen: <a href="${esc(st.url)}" target="_blank" rel="noopener">der signierte Pass</a> · <a href="https://${esc(r.issuer)}/.well-known/pazair-receipts.json" target="_blank" rel="noopener">der öffentliche Schlüssel</a> · <a href="${esc(rootUrl)}" target="_blank" rel="noopener">die Tagesroots</a> · <a href="https://github.com/Kula-Labs/pazair/blob/main/SPEC.md" target="_blank" rel="noopener">Spec (MIT)</a></div>`;
}

function renderAgent(r, st) {
  const d = st.doc, a = r.anchored;
  const block = (title, note, body) => `<div class="block"><h3>${title}<em>${note}</em></h3>${body}</div>`;
  const det = (title, note, obj) => `<div class="block"><details><summary>${title} <em style="font-weight:400;color:var(--muted)">${note}</em></summary><pre>${hl(obj)}</pre></details></div>`;
  $('agent').innerHTML = `
    ${block('Der Dialog', 'SPEC §9', `<div class="dialog"><div class="q">May I see your Word Pass?</div><div class="a">${esc(d.show_it?.answer ?? 'Here is my Word Pass: ' + st.url)}</div><div class="q">check_word_pass { url, nonce, proof }</div></div>`)}
    ${block('Das Urteil', 'checkWordPass() · pazair-verify', `<div class="verdict"><span class="trust ${r.trust}">${r.trust}</span><span>issuer: ${esc(r.issuer)}</span></div><pre>${hl({ trust: r.trust, issuer: r.issuer, checks: r.checks, say: r.say })}</pre>`)}
    ${det('current', 'der Pass von heute, signiert', d.current ?? r.pass)}
    ${a ? det('anchored.pass', 'der Pass im letzten verankerten Root', a.pass) : ''}
    ${a ? det('anchored.leaf + proof + root', `${a.proof.length} Geschwister bis zum Root`, { leaf: a.leaf, proof: a.proof, root: a.root }) : ''}
    ${d.show_it ? det('show_it', 'Agent-Card, HTTP-Header, well-known', d.show_it) : ''}
    ${d.fingerprint ? det('fingerprint', 'Seed und Regel des Abdrucks', d.fingerprint) : ''}
    ${d.next_badge ? det('next_badge', 'was fehlt', d.next_badge) : ''}
    ${d.how_to_verify ? block('how_to_verify', 'vier Schritte', `<pre style="white-space:pre-wrap">${esc(d.how_to_verify)}</pre>`) : ''}`;
}

function setSource(st) {
  $('source').textContent = st.live ? `Live geladen von ${st.origin} · ${new Date().toLocaleString('de-CH')}` : `Schnappschuss vom ${SNAP.taken} (Live-Abruf aus dieser Ansicht gesperrt). Signatur und Merkle-Pfad werden trotzdem jetzt im Browser nachgerechnet.`;
}

async function run(u) {
  $('url').value = u; $('go').disabled = true;
  for (const c of document.querySelectorAll('.chip')) c.setAttribute('aria-pressed', String(c.dataset.u === u));
  $('human').innerHTML = '<p class="foot">Lade und prüfe …</p>'; $('agent').innerHTML = '';
  try { const st = await load(u); setSource(st); const r = await check(st); renderHuman(r, st); renderAgent(r, st); }
  catch (e) { $('human').innerHTML = `<p class="err">${esc(e.message)}</p>`; $('source').textContent = ''; }
  $('go').disabled = false;
}

for (const [id, s] of Object.entries(SNAP.passes)) { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.u = id; b.textContent = s.doc.current?.name ?? id; b.setAttribute('aria-pressed', 'false'); b.onclick = () => run(id); $('chips').appendChild(b); }
$('f').addEventListener('submit', (e) => { e.preventDefault(); const u = $('url').value.trim(); if (u) run(u); });
run(Object.keys(SNAP.passes)[0]);
</script>

</body>
